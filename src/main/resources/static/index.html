<main id="inicio">

    <h1>Visão Geral</h1>

    <div class="cards-container">

        <section class="card">
            <h2>Total de Entradas</h2>
            <p id="totalEntradas">R$ 0,00</p>
        </section>

        <section class="card">
            <h2>Total de Saídas</h2>
            <p id="totalSaidas">R$ 0,00</p>
        </section>

        <section class="card">
            <h2>Saldo Atual</h2>
            <p id="saldoAtual">R$ 0,00</p>
        </section>

    </div>

    <section class="grafico-container">
        <h2>Distribuição dos Gastos</h2>
        <canvas id="graficoCategorias"></canvas>
    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
