<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Movimentação</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Controle Financeiro</h1>
</header>

<main>

    <a href="index.html" class="btn-voltar">
        ← Voltar ao dashboard
    </a>

    <h1>Nova Movimentação</h1>

    <section id="cadastro">

        <p id="mensagem"></p>
        <form id="formMovimentacao">

            <label for="descricao">Descrição</label>
            <input type="text" id="descricao" name="descricao"
                   placeholder="Ex: Compra no supermercado" required>

            <label for="tipo">Tipo de movimentação</label>
            <select id="tipo" name="tipoMovimentacao" required>
                <option value="">Selecione</option>
                <option value="ENTRADA">Entrada</option>
                <option value="SAIDA">Saída</option>
            </select>

            <label for="categoria">Categoria</label>
            <select id="categoria" name="categoriaGasto" required>
                <option value="">Selecione</option>
                <option value="ALIMENTACAO">Alimentação</option>
                <option value="TRANSPORTE">Transporte</option>
                <option value="MORADIA">Moradia</option>
                <option value="SAUDE">Saúde</option>
                <option value="EDUCACAO">Educação</option>
                <option value="LAZER">Lazer</option>
                <option value="ASSINATURAS">Assinaturas</option>
                <option value="COMPRAS">Compras</option>
                <option value="OUTROS">Outros</option>
            </select>

            <label for="valor">Valor</label>
            <input type="number" id="valor" name="valor"
                   step="0.01"  placeholder="0,00" required>

            <label for="data">Data</label>
            <input type="date" id="data" name="data" required>

            <button type="submit">Cadastrar movimentação</button>

        </form>
    </section>


</main>

<script src="js/app.js"></script>

</body>
</html>
